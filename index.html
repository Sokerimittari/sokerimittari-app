<!DOCTYPE html><html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sokerimittari</title>
<style>
body{font-family:Arial,sans-serif;background:#171717;color:#eee;max-width:700px;margin:0 auto;padding:20px}
h1{color:#ffcc66}
input{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;background:#292929;color:white;border:1px solid #555;border-radius:6px;font-size:16px}
button{padding:13px 18px;margin:10px 0;background:#ffcc66;color:#171717;border:0;border-radius:6px;font-weight:bold;font-size:16px}
.card{background:#292929;padding:14px;margin:12px 0;border-radius:8px}
.small{color:#bbb;font-size:13px}
.result{color:#ffcc66;font-size:19px;font-weight:bold}
</style>
</head>
<body>
<h1>🎵 Sokerimittari</h1><input id="artist" placeholder="Artisti">
<input id="song" placeholder="Kappale">
<button onclick="evaluateSong()">Arvioi kappale</button>
<p id="message" class="small"></p>
<div id="current"></div><h2>Aiemmat tulokset</h2>
<div id="history"></div><script>
const KEY="sokerimittari-history-v1";
let songs=[];
try { songs=JSON.parse(localStorage.getItem(KEY)||"[]"); } catch(e) {}

function safe(text){
 return String(text).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function showHistory(){
 const history=document.getElementById("history");
 if(!songs.length){
  history.innerHTML='<p class="small">Ei vielä tallennettuja tuloksia.</p>';
  return;
 }
 history.innerHTML=songs.slice().reverse().map(x=>
  '<div class="card"><strong>'+safe(x.artist)+' – '+safe(x.song)+'</strong>'+
  '<p class="result">Sokerisuus: '+x.sugar+' %</p>'+
  '<p class="result">Mausteisuus: '+x.spice+' %</p>'+
  '<p class="small">'+safe(x.date)+'</p></div>'
 ).join("");
}

function evaluateSong(){
 const artist=document.getElementById("artist").value.trim();
 const song=document.getElementById("song").value.trim();
 const message=document.getElementById("message");
 const current=document.getElementById("current");

 if(!artist||!song){
  message.textContent="Kirjoita artistin ja kappaleen nimi.";
  return;
 }

 current.innerHTML="";
 message.textContent="Arviointia ei ole vielä kytketty käyttöön. Kappaletta ei tallennettu.";
}

showHistory();
</script></body>
</html>
