<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sokerimittari</title>

  <style>
    :root {
      --background: #fff9cf;
      --card: #fffef5;
      --pink: #f27cae;
      --text: #29251f;
      --muted: #716b60;
      --border: #e8dfb5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px 12px 28px;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.4;
    }

    main {
      max-width: 620px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 2.1rem;
      letter-spacing: -1px;
    }

    h2 {
      font-size: 1.1rem;
    }

    .subtitle {
      margin: 4px 0 16px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin: 11px 0 5px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      min-height: 40px;
      padding: 9px 10px;
      border: 1px solid #d8d0b3;
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
    }

    button {
      cursor: pointer;
      font: inherit;
    }

    .primary {
      width: 100%;
      min-height: 43px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: var(--pink);
      color: #291522;
      font-weight: bold;
    }

    .primary:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      margin-top: 10px;
      font-size: 0.85rem;
      overflow-wrap: anywhere;
    }

    .error {
      color: #a51d35;
    }

    .hidden {
      display: none !important;
    }

    /* Jaettava tuloskortti */

    .share-card {
      padding: 0;
      margin-bottom: 15px;
      overflow: hidden;
      background: #fff9cf;
      border: 1px solid #e8dfb5;
      border-radius: 16px;
      color: #29251f;
    }

    .share-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 10px;
      background: var(--pink);
      color: #29251f;
    }

    .share-header-label {
      font-size: 0.82rem;
      font-weight: bold;
    }

    .share-actions {
      display: flex;
      gap: 4px;
    }

    .icon-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 35px;
      height: 35px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #29251f;
      font-size: 1.45rem;
    }

    .icon-button:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .share-content {
      padding: 12px 15px;
    }

    .share-title {
      margin: 2px 0 13px;
      font-size: 1.25rem;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .share-scores {
      margin: 0 0 13px;
      padding: 0;
      list-style: none;
      font-size: 0.98rem;
    }

    .share-scores li {
      margin: 4px 0;
    }

    .share-analysis {
      margin: 13px 0;
      font-size: 0.88rem;
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .share-tags {
      margin-top: 13px;
      font-size: 0.82rem;
      color: #55465d;
    }

    .share-status {
      min-height: 18px;
      margin: 5px 2px 12px;
      color: var(--muted);
      font-size: 0.8rem;
    }
