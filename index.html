<!DOCTYPE html><html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sokerimittari</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #171717;
  color: white;
  max-width: 600px;
  margin: 30px auto;
  padding: 20px;
}
h1 { color: #ffcc66; }
p { line-height: 1.5; }
textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 120px;
  padding: 12px;
  font-size: 16px;
  border-radius: 8px;
}
button {
  background: #ffcc66;
  color: #171717;
  border: 0;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  margin-top: 12px;
}
#result {
  font-size: 28px;
  color: #ffcc66;
  margin-top: 20px;
}
</style>
</head>
<body>
<h1>🎵 Sokerimittari</h1>
<p>Millaisen tunteen tämä musiikki herättää? Kerro artisti, kappale ja oma kuuntelukokemuksesi.</p><textarea id="music" placeholder="Artisti, kappale ja omat ajatukset..."></textarea><br>
<button onclick="measure()">Arvioi sokeritaso</button><div id="result"></div>
<p id="note"></p><script>
function measure() {
  const text = document.getElementById('music').value.trim();
  const result = document.getElementById('result');
  const note = document.getElementById('note');

  if (!text) {
    result.textContent = 'Kirjoita ensin kappaleen tiedot.';
    note.textContent = '';
    return;
  }

  result.textContent = 'Sokeritaso: ei vielä arvioitu';
  note.textContent =
    'Tämä on Sokerimittarin perusversio. Automaattinen musiikkianalyysi ja omat vertailukappaleet lisätään seuraavassa vaiheessa.';
}
</script></body>
</html>
